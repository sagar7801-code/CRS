{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=Edge">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
        <meta name="csrf-token" content="iL8hUXsdXy71MbOZjq4fWUv4KGPZnJ7k17P7RClL">
        <link rel="icon" href="{% static 'assets\images\LOGO.png' %}" type="image/x-icon"> <!-- Favicon-->
        <title>Sign up - CRS</title>
        <meta name="description" content="Oero Laravel">
        <meta name="author" content="Oero Laravel">
        
        
        
        <link rel="stylesheet" href="{% static 'assets\plugins\bootstrap\css\bootstrap.min.css' %}">
        
        <!-- Custom Css -->
        <link rel="stylesheet" href="{% static 'assets\css\main.css' %}">
        <link rel="stylesheet" href="{% static 'assets\css\authentication.css' %}">
        <link rel="stylesheet" href="{% static 'assets\css\color_skins.css' %}">

        
    </head>
    
    
        <body class="theme-blush authentication sidebar-collapse">

        <nav class="navbar navbar-expand-lg fixed-top navbar-transparent">
            <div class="container">        
                <div class="navbar-translate n_logo">
                    <a class="navbar-brand" title="" target="_blank">Campus Recruitment System</a>
                    <button class="navbar-toggler" type="button">
                        <span class="navbar-toggler-bar bar1"></span>
                        <span class="navbar-toggler-bar bar2"></span>
                        <span class="navbar-toggler-bar bar3"></span>
                    </button>
                </div>
                <div class="navbar-collapse">
                    <ul class="navbar-nav">                
                        <li class="nav-item">
                            <a class="nav-link btn btn-white btn-round" href="{% url 'login' %}">SIGN IN</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="page-header">
            <div class="page-header-image" style="background-image:url('{% static 'assets\images\jobbg.jpg' %}')"></div>

            <div class="container">
    <div class="col-md-12 content-center">
        <div class="card-plain">
            <form class="form" method="POST" action="{% url 'college-signup' %}">
                {% csrf_token %}
                <div class="header">
                    <div class="logo-container">
                        <img src="{% static 'assets\images\logo.png' %}" alt="">
                    </div>
                    <h5>College Sign Up</h5>
                    <span>Register a new account</span>
                </div>
                <div class="content">       
                    <div class="input-group">
                        <input type="text" class="form-control" name="name" placeholder="Enter College Name">
                        <span class="input-group-addon">
                            <i class="zmdi zmdi-account-circle"></i>
                        </span>
                    </div>                                         
                    <div class="input-group">
                        <input type="text" class="form-control" name="fname" placeholder="Enter First Name">
                        <span class="input-group-addon">
                            <i class="zmdi zmdi-account-circle"></i>
                        </span>
                    </div>
                    <div class="input-group">
                        <input type="text" class="form-control" name="lname" placeholder="Enter Last Name">
                        <span class="input-group-addon">
                            <i class="zmdi zmdi-account-circle"></i>
                        </span>
                    </div>
                    <div class="input-group">
                        <input type="text" class="form-control" name="email" placeholder="Enter Email">
                        <span class="input-group-addon">
                            <i class="zmdi zmdi-email"></i>
                        </span>
                    </div>
                    <div class="input-group">
                        <input type="text" placeholder="Contact No." class="form-control" name="contact">
                        <span class="input-group-addon">
                            <i class="zmdi zmdi-phone"></i>
                        </span>
                    </div>  
                    <div class="input-group">
                        <input type="text" placeholder="Address..." class="form-control" name="address">
                        <span class="input-group-addon">
                            <i class="zmdi zmdi-comment-alt-text"></i>
                        </span>
                    </div>                        
                </div>
                <div class="footer text-center">
                    <input type="submit" class="btn btn-primary btn-round btn-lg btn-block" value="SIGN UP">
                    <h5><a class="link" href="{% url 'login' %}">You already have an account?</a></h5>
                </div>
            </form>
        </div>
    </div>
</div>


            
        </div>

        <!-- Scripts -->
                <script src="{% static 'assets\bundles\libscripts.bundle.js' %}"></script>    
        <script src="{% static 'assets\bundles\vendorscripts.bundle.js' %}"></script>
                
    </body>
</html>
