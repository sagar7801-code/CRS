{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=Edge">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
        <meta name="csrf-token" content="iL8hUXsdXy71MbOZjq4fWUv4KGPZnJ7k17P7RClL">
        <link rel="icon" href="https://thememakker.com/templates/oreo/hospital/laravel/public/favicon.ico" type="image/x-icon"> <!-- Favicon-->
        <title>Forget Password - CRS</title>
        <meta name="description" content="Oero Laravel">
        <meta name="author" content="Oero Laravel">
        
        
        
        <link rel="stylesheet" href="{% static 'assets\plugins\bootstrap\css\bootstrap.min.css' %}">
        
        <!-- Custom Css -->
        <link rel="stylesheet" href="{% static 'assets\css\main.css' %}">
        <link rel="stylesheet" href="{% static 'assets\css\authentication.css' %}">
        <link rel="stylesheet" href="{% static 'assets\css\color_skins.css' %}">

        
    </head>
    
    
        <body class="theme-cyan authentication sidebar-collapse">

        <nav class="navbar navbar-expand-lg fixed-top navbar-transparent">
            <div class="container">        
                <div class="navbar-translate n_logo">
                    <a class="navbar-brand" title="" target="_blank">Forgot Password</a>
                    <button class="navbar-toggler" type="button">
                        <span class="navbar-toggler-bar bar1"></span>
                        <span class="navbar-toggler-bar bar2"></span>
                        <span class="navbar-toggler-bar bar3"></span>
                    </button>
                </div>
                <div class="navbar-collapse">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'index' %}">Home</a>
                        </li>
                        
                    </ul>
                </div>
            </div>
        </nav>

        <div class="page-header">
            <div class="page-header-image" style="background-image:url('{% static 'assets/images/jobbg.jpg' %}')"></div>

            <div class="container">
    <div class="col-md-12 content-center">
        <div class="card-plain">
            <form action="{% url 'send_OTP' %}" class="form" method="POST">
                {% csrf_token %}
                <div class="header">
                    <div class="logo-container">
                        <img class="zmdi zmdi-hc-spin" src="{% static 'chairman\assets\images\logo.svg' %}" alt="">
                    </div>
                    
                    {% if e_msg %}
                    <div class="alert alert-danger" role="alert">
                        {{e_msg}}
                    </div>
                    {% endif %}
                </div>
                    <h6>Forgot Password</h6>
                <div class="content">                                                
                    <div class="input-group input-lg">
                        <input type="text" class="form-control" name="email" id="email" placeholder="Enter Email">
                        <span class="input-group-addon">
                            <i class="zmdi zmdi-account-circle"></i>
                        </span>
                    </div>
                </div>
                <div class="footer text-center">
                    <input type="submit" class="btn btn-primary btn-round btn-lg btn-block" value="Send OTP" >
                    <h5><a href="{% url 'login' %}" class="link">Clik here to Login!</a></h5>
                </div>
            </form>
        </div>
    </div>
</div>

            
        </div>
        <script src="https://code.jquery.com/jquery-3.1.0.min.js"></script>

        <script>
            $("#email").blur(function() {
                var email = $(this).val();

                $.ajax({
                    url: "{% url 'emailajax' %}",
                    data: {
                        'email': email
                    },
                    dataType: 'json',

                    success: function(data) {
                        if (!data.is_taken) {
                            $('#email').val("").css("color", "red");
                            $('#email').addClass('inputredplace');
                            $('#email').attr('placeholder', 'Email Does Not Exist');
                            $('#submit').attr("disabled", true)

                            // $('#email').val("Email Does Not Exist").css("color", "red");
                        } else {
                            $('#email').css('color', 'white');
                            $('#submit').removeAttr("disabled")
                        }
                    }
                });
            });
        </script>
        <!-- Scripts -->
                <script src="{% static 'assets\bundles\libscripts.bundle.js' %}"></script>    
        <script src="{% static 'assets\bundles\vendorscripts.bundle.js' %}"></script>
                
    </body>
</html>
